version: '3.9'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=ecommerce_db
      - DB_USER=root
      - DB_PASSWORD=Hyperion101
      - DB_HOST=db
      - DB_PORT=3306

  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: root
      MYSQL_PASSWORD: Hyperion101
      MYSQL_ROOT_PASSWORD: Hyperion101
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: